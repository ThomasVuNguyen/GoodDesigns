<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoodDesigns</title>
  <meta name="description" content="A personal gallery of high-fidelity website recreations worth studying.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23151412'/><path d='M9 22 16 8l7 14' fill='none' stroke='%23f2efe8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="app.css">
  <script src="https://rybbit.beenex.org/api/script.js?siteId=c0f0d113f98d" defer></script>
</head>
<body>
  <main id="gallery" class="gallery">
    <header class="masthead">
      <h1>Good<span>Designs</span></h1>
      <p>Recreations of sites worth studying, and videos worth watching. Open one to explore it, or jump to its source.</p>
    </header>
    <nav id="tabs" class="tabs" aria-label="Sections">
      <a href="#/" data-tab="sites" aria-current="page">Sites <span id="n-sites"></span></a>
      <a href="#/videos" data-tab="videos">Videos <span id="n-videos"></span></a>
    </nav>
    <section id="panel-sites" class="section" data-tab="sites" aria-labelledby="sites-title">
      <h2 class="section-title" id="sites-title">Good <em>Sites</em></h2>
      <ul id="grid" class="grid" aria-label="Sites"></ul>
    </section>
    <section id="panel-videos" class="section" data-tab="videos" aria-labelledby="videos-title" hidden>
      <h2 class="section-title" id="videos-title">Good <em>Videos</em></h2>
      <ul id="video-grid" class="grid" aria-label="Videos"></ul>
    </section>
    <footer class="foot">For design study only. Trademarks, copy and imagery belong to their owners.</footer>
  </main>

  <section id="viewer" class="viewer" hidden>
    <iframe id="frame" title="Site preview" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    <nav class="float" aria-label="Viewer">
      <a class="fab" id="back" href="#/">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 9.2 10 3l7 6.2M5 7.6V17h3.6v-4.6h2.8V17H15V7.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </a>
      <a class="fab fab--dark" id="v-src" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path id="v-src-icon" d="M7 6 3 10l4 4M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="v-src-label">View source</span>
      </a>
    </nav>
  </section>
  <script src="app.js"></script>
</body>
</html>
