<text x="18.736 26.104 31.534 33.651 35.769 40.809 43.521 49.146 54.186 59.615 62.328 69.511 76.878 83.477 86.189 91.619 96.659 99.371 104.801 110.426 113.138 115.256 120.88 125.92 129.022 132.309 137.933 143.363 146.465 148.582 154.402 160.026 162.738 171.48 176.91 182.534 188.159 193.588 195.706 198.418 201.315 207.135 210.421 213.134 221.875 227.305 232.54 234.657 240.282 246.101 248.813 254.828 257.93 263.749 266.851 272.281 274.398 280.023 285.063 288.213" y="80" font-size="10.5">Cells use DNA as an instruction manual for making proteins. </text>
<text x="18.736 24.945 29.985 35.415 38.702 43.742 46.454 52.078 54.791 56.908 62.338 65.44 68.542 73.972 77.258 82.298 85.011 90.83 93.727 96.439 103.622 110.99 117.588 120.301 125.73 131.55 137.564 142.994 145.706 148.603 154.422 157.709 160.421 166.24 171.865 177.295 180.007 185.437 194.178 196.296 201.92 207.74 210.452 215.882 221.311 223.429 229.443 232.155 234.868 240.297 245.922 251.936 254.648 260.078 265.702 271.132 273.25 278.874 282.024" y="92" font-size="10.5">Every 3 letters of DNA code for one amino acid, and chains </text>
<text x="18.736 24.556 27.453 30.165 35.595 44.336 46.454 52.078 57.898 60.61 66.04 71.469 73.587 79.601 84.641 87.353 96.095 101.525 106.76 112.189 114.902 120.916 124.018 129.837 132.939 138.369 140.486 146.111 151.151 154.301" y="104" font-size="10.5">of amino acids make proteins. </text>
<text x="18.736 26.494 32.313 38.912 41.624 43.742 48.782 51.494 56.924 59.636 65.65 68.752 74.571 77.673 83.103 85.221 90.845 93.557 96.659 102.284 107.714 110.816 113.528 119.152 124.582 127.684 133.309 136.595 142.025 144.142 146.26 151.3 154.012 159.451 159.237 164.861 170.681 173.783 179.212 184.252 189.682 195.112 200.152 202.864 205.576 207.694 210.796 213.508 218.938 224.952 229.992 235.812 239.098 245.112 250.152 252.865 258.879 260.996 266.621 269.771" y="128" font-size="10.5">GFP is a protein that naturally fluoresces, it absorbs blue </text>
<text x="18.736 20.854 22.972 28.791 34.415 37.517 40.23 45.659 51.284 57.298 60.01 65.44 74.182 76.299 79.401 84.441 87.154 92.973 96.075 101.505 106.934 112.559 115.271 117.389 119.506 125.326 130.95 134.052 137.202" y="140" font-size="10.5">light and emits green light. </text>
<text x="18.736 24.556 30.18 35.61 38.322 46.079 51.899 58.497 61.21 67.029 72.459 78.083 83.513 86.225 88.343 93.383 96.095 101.525 106.954 110.241 113.528 115.645 121.075 127.089 129.801 135.621 141.245 143.957 149.387 152.099 155.201 157.319 162.944 167.984 170.696 176.126 178.243 181.345 186.775 192.399 194.517 199.947 203.233 205.946 211.96 214.077 219.507 224.937 230.366 233.079 238.898 241.795 244.507 251.69 259.058 262.208" y="164" font-size="10.5">The GFP gene is carried on a tiny circular piece of DNA </text>
<text x="18.736 24.166 29.596 31.713 33.831 39.261 45.275 47.987 53.417 56.129 62.143 64.261 69.69 74.73 83.472 85.59 91.604 94.316 97.029 105.945 111.374 114.087 116.204 118.322 121.034 129.776 131.894 137.118 139.83 142.932 148.557 153.987 156.699 162.713 168.143 173.572 176.674 182.104 185.391 187.508 192.938 195.65 203.397 205.515 208.617 214.241 216.954 222.383 228.008 233.438 242.179 244.297 249.726 255.156 257.274 260.424" y="176" font-size="10.5">called a plasmid. We&#x27;ll mix the bacteria with chemicals </text>
<text x="18.736 21.838 27.463 32.892 35.994 38.707 41.809 47.238 55.98 61.994 67.814 71.1 76.53 79.816 81.934 84.052 89.092 91.804 100.546 105.975 111.21 116.64 119.352 122.454 128.079 133.508 135.626 138.913 141.625 147.055 152.484 154.602 156.719 159.432 167.179 172.608 174.726 176.844 181.884 184.596 186.714 192.143 197.573 202.808 207.069 209.781 212.493 215.595 221.22 226.649 232.274 234.986 240.416 246.43 249.58" y="188" font-size="10.5">that temporarily make their cell walls leaky, then add </text>
<text x="18.736 21.838 27.463 32.892 35.605 41.619 43.737 49.166 54.206 62.948 65.066 71.08 74.23" y="200" font-size="10.5">the plasmid. </text>
<text x="18.736 25.335 31.154 39.896 45.326 48.038 54.052 59.482 64.911 68.013 73.443 76.73 78.847 84.277 86.989 94.736 96.854 98.972 101.089 103.802 109.231 115.245 120.285 126.105 129.391 135.405 138.118 141.22 146.844 152.274 154.986 161 163.118 168.548 173.588 182.329 184.447 190.461 193.173 198.603 204.227 210.242 212.954 217.994 221.096 226.526 229.812 232.914 235.627 241.641 244.743 250.562 256.576 262.201 267.63 269.748 275.372 278.522" y="224" font-size="10.5">Some bacteria will absorb the plasmid and start producing </text>
<text x="18.736 26.494 32.313 37.035 39.747 42.46 50.227 55.852 57.969 63.009 65.722 68.824 74.448 79.878 82.59 85.692 88.979 94.409 100.033 105.073 107.97 113.789 117.076 125.817 131.247 137.261 139.974 145.988 151.417 156.847 159.949 165.379 168.665 170.783 176.213 178.925 183.965 189.589 192.876 197.916 200.034 205.074 210.503 213.216 219.035 224.659 227.372 233.191 238.816 242.102 244.814 250.244 255.869 258.971 261.088 267.102 269.22 275.039 278.141 280.259 283.409" y="236" font-size="10.5">GFP. Only the transformed bacteria survive on our antibiotic </text>
<text x="18.736 24.75 26.868 32.298 35.4 40.829 45.869 48.582 51.294 59.041 64.666 66.783 72.213 77.837 80.55 86.369 88.487 94.306 102.053 104.765 110.585 113.687 119.116 124.546 130.17 132.883 135 140.625 143.337 149.351 151.469 157.094 162.523 165.236 167.353 169.471 175.29 180.915 184.017 187.167" y="248" font-size="10.5">plates, which glow green in blue light. </text>
<text x="38.832 44.488 46.303 50.957 55.277 62.77 64.585 69.74 72.065 78.705 80.521 83.179 85.879" y="356" font-size="9">Plasmid with </text>

<text x="167.53 173.533 178.187 182.841 185.5 190.154 192.971 194.786 197.486" y="361" font-size="9">Bacteria </text>
<text x="289.97 295.973 300.627 305.281 307.94 312.594 315.411 317.226 319.926" y="356" font-size="9">Bacteria </text>
