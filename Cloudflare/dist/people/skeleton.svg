<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
    <clipPath id="skelly-clip">
      <rect width="100%" height="100%" x="0" y="0" rx="8"></rect>
    </clipPath>
    <linearGradient id="gradient">
      <stop offset="0%" stop-color="#F6F6F6" stop-opacity="1">
        <animate
          attributeName="offset"
          dur="1s"
          keyTimes="0; 0.25; 1"
          repeatCount="indefinite"
          values="-2; -2; 1"></animate>
      </stop>
      <stop offset="50%" stop-color="#E8E6E6" stop-opacity="1">
        <animate
          attributeName="offset"
          dur="1s"
          keyTimes="0; 0.25; 1"
          repeatCount="indefinite"
          values="-1; -1; 2"></animate>
      </stop>
      <stop offset="100%" stop-color="#F6F6F6" stop-opacity="1">
        <animate
          attributeName="offset"
          dur="1s"
          keyTimes="0; 0.25; 1"
          repeatCount="indefinite"
          values="0; 0; 3"></animate>
      </stop>
    </linearGradient>
  </defs>
  <rect
    width="100"
    height="100"
    fill="url(#gradient)"
    x="0"
    y="0"
    clip-path="url(#skelly-clip)"
  >
  </rect>
</svg>
