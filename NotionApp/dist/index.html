<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Health Science Lab | Notion</title>
  <meta name="description" content="A working clone of the Notion app: sidebar, block editor, search and Notion AI chat.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved or system theme before first paint.
    try {
      var s = JSON.parse(localStorage.getItem('notion-clone-state') || 'null');
      var t = (s && s.ui && s.ui.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">This clone of the Notion app needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
